# =======================================================
#               EasySettings Modern Configuration
# =======================================================

gui:
  # Title of the GUI. Supports Hex (&#66FCF1), legacy (&a), and small caps tags (<sc>text</sc>)
  title: "&#66FCF1&lᴘʟᴀʏᴇʀ sᴇᴛᴛɪɴɢs"

  # Size of the GUI in slots. Must be 9, 18, 27, 36, 45, or 54.
  size: 27

  # Placeholder text for %status% in setting lore
  status:
    enabled: "&#51CF66● ᴇɴᴀʙʟᴇᴅ"
    disabled: "&#FF6B6B○ ᴅɪsᴀʙʟᴇᴅ"

  # Background glass pane filler for empty slots
  filler:
    enabled: true
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "

  # Close button at the bottom of the GUI
  close-button:
    enabled: true
    slot: 22
    material: "BARRIER"
    name: "&#FF6B6B&l✕ ᴄʟᴏsᴇ ᴍᴇɴᴜ"
    lore:
      - "&#868E96Click to exit the settings menu."

